services:
  - type: web
    name: talk-to-krishna-api
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build:api
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: auto
      - key: GROQ_MODEL_NAME
        value: openai/gpt-oss-20b
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Talk to Krishna <contact@codealgo.live>"

databases:
  - name: talk-to-krisna-db
    plan: free
    region: singapore
    databaseName: talk_to_krisna_db
    user: talk_to_krisna_db_user
