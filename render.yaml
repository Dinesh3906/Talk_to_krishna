services:
  - type: web
    name: talk-to-krishna-api
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npm run build:api
    # Schema migrations are a separate, explicitly approved deployment operation.
    startCommand: npm run start:api
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OTP_PEPPER_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL_NAME
        value: openai/gpt-oss-20b
      - key: DISABLE_LOCAL_EMBEDDING
        value: "true"
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_USER
        value: ajay390620@gmail.com
      - key: SMTP_FROM
        value: "Talk to Krishna <ajay390620@gmail.com>"
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

databases:
  - name: talk-to-krisna-db
    plan: free
    region: singapore
    databaseName: talk_to_krisna_db
    user: talk_to_krisna_db_user
